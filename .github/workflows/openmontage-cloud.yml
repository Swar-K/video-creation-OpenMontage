
name: OpenMontage Cloud Video Renderer

on:
  workflow_dispatch:
    inputs:
      demo:
        description: "Choose a video to render"
        required: true
        type: choice
        options:
          - world-in-numbers
          - code-to-screen
          - focusflow-pitch
        default: world-in-numbers

permissions:
  contents: read

concurrency:
  group: openmontage-render
  cancel-in-progress: false

jobs:
  render:
    name: Render video in cloud
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout OpenMontage
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify environment
        run: |
          python --version
          node --version
          npm --version
          ffmpeg -version

      - name: List available demos
        run: python render_demo.py --list

      - name: Render selected video
        run: |
          python render_demo.py "${{ inputs.demo }}"

      - name: Upload finished videos
        uses: actions/upload-artifact@v4
        with:
          name: openmontage-${{ inputs.demo }}
          path: projects/demos/renders/*.mp4
          if-no-files-found: error
          retention-days: 7

