name: Amazon Video Agent Integration Test

on:
  pull_request:
    branches:
      - main
    paths:
      - "integrations/amazon_video_agent/**"
      - "scripts/import_amazon_video_agent.py"
      - "tests/integrations/**"
      - ".github/workflows/amazon-video-agent-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amazon-video-agent-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-and-validate:
    name: Import sample project and validate artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenMontage
        uses: actions/checkout@v4
        with:
          path: openmontage

      - name: Checkout Amazon Video Agent sample
        uses: actions/checkout@v4
        with:
          repository: Swar-K/amazon-video-agent
          ref: main
          path: amazon-video-agent
          # Public source repository; no write token or secrets are needed.

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal importer dependencies
        run: python -m pip install --upgrade pip PyYAML jsonschema

      - name: Run importer unit tests
        working-directory: openmontage
        run: python -m unittest discover -s tests/integrations -p 'test_*.py' -v

      - name: Import sample project into an isolated workspace
        working-directory: openmontage
        run: |
          python scripts/import_amazon_video_agent.py \
            --amazon-project ../amazon-video-agent/projects/B00002NCJI \
            --project-id amazon-B00002NCJI-ci \
            --projects-dir "$RUNNER_TEMP/openmontage-projects" \
            --media-mode copy

      - name: Verify generated artifacts and approval boundaries
        working-directory: openmontage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          project = Path("${{ runner.temp }}/openmontage-projects/amazon-B00002NCJI-ci")
          artifacts = project / "artifacts"
          required = ("brief.json", "script.json", "scene_plan.json", "asset_manifest.json")
          for name in required:
              path = artifacts / name
              assert path.is_file(), f"Missing artifact: {name}"
              json.loads(path.read_text(encoding="utf-8"))
              print(f"Validated JSON file exists: {name}")

          scene_plan = json.loads((artifacts / "scene_plan.json").read_text(encoding="utf-8"))
          script = json.loads((artifacts / "script.json").read_text(encoding="utf-8"))
          manifest = json.loads((artifacts / "asset_manifest.json").read_text(encoding="utf-8"))
          assert scene_plan["scenes"], "Scene plan is empty"
          assert script["sections"], "Script sections are empty"
          sections = {item["id"]: item for item in script["sections"]}
          for scene in scene_plan["scenes"]:
              section_id = scene.get("script_section_id")
              assert section_id in sections, f"{scene['id']} references unknown script section {section_id!r}"
              anchor = sections[section_id]["start_seconds"]
              assert abs(scene["start_seconds"] - anchor) <= 0.002, (
                  f"{scene['id']} does not start at its narration anchor"
              )
              duration = scene["end_seconds"] - scene["start_seconds"]
              assert 0 < duration <= 5.01, (
                  f"{scene['id']} should remain a short ~5-second source clip, got {duration:.3f}s"
              )
          assert not (artifacts / "edit_decisions.json").exists(), "Importer must not invent edit decisions"
          print(f"Scenes: {len(scene_plan['scenes'])}; all anchored to script sections and kept to ~5 seconds")
          print(f"Script sections: {len(script['sections'])}")
          print(f"Manifest assets: {len(manifest['assets'])}")
          print("Approval boundary check: no edit_decisions artifact was created")
          PY

      - name: Verify imported media files and style playbook
        working-directory: openmontage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from styles.playbook_loader import load_playbook

          project = Path("${{ runner.temp }}/openmontage-projects/amazon-B00002NCJI-ci").resolve()
          manifest_path = project / "artifacts" / "asset_manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          assets = manifest.get("assets", [])
          assert assets, "Asset manifest contains no assets"

          checked = []
          failures = []
          for asset in assets:
              relative = Path(asset["path"])
              if relative.is_absolute():
                  failures.append(f"{asset['id']}: absolute path is not allowed: {relative}")
                  continue
              candidate = (project / relative).resolve()
              if not candidate.is_relative_to(project):
                  failures.append(f"{asset['id']}: path escapes project directory: {relative}")
                  continue
              if not candidate.is_file():
                  failures.append(f"{asset['id']}: missing file: {relative}")
                  continue
              try:
                  with candidate.open("rb") as handle:
                      sample = handle.read(1)
                  if candidate.stat().st_size == 0 or not sample:
                      failures.append(f"{asset['id']}: file is empty: {relative}")
                      continue
              except OSError as exc:
                  failures.append(f"{asset['id']}: cannot read {relative}: {exc}")
                  continue
              checked.append((asset["id"], relative.as_posix(), candidate.stat().st_size))

          print(f"Manifest assets: {len(assets)}")
          print(f"Readable local files: {len(checked)}")
          for asset_id, relative, size in checked:
              print(f"OK {asset_id}: {relative} ({size} bytes)")
          if failures:
              print("Media integrity failures:")
              for failure in failures:
                  print(f" - {failure}")
              raise SystemExit(1)

          playbook = load_playbook("clean-professional")
          assert playbook.get("identity", {}).get("name"), "Playbook has no identity.name"
          print("Style playbook: clean-professional loaded and schema-validated")
          print("Media integrity check passed")
          PY

      - name: Upload imported artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: amazon-video-agent-import-test
          path: ${{ runner.temp }}/openmontage-projects/amazon-B00002NCJI-ci/artifacts/*.json
          if-no-files-found: error
          retention-days: 7
